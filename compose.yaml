services:
  node:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
    volumes: ["healthbridge-data:/app/storage"]
    init: true
    restart: unless-stopped
  java:
    build:
      context: .
      dockerfile: Dockerfile.java
    profiles: ["java"]
    ports: ["3001:3000"]
    init: true
volumes:
  healthbridge-data:
